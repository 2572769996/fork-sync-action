name: 同步 Fork 仓库

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出工作流代码
        uses: actions/checkout@v4

      - name: 同步 Fork 默认分支并生成中文报告
        env:
          GH_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -uo pipefail

          gh auth setup-git

          work_root=$(mktemp -d)
          trap 'rm -rf "$work_root"' EXIT
          report_file="$work_root/fork-sync-report.md"
          run_stamp="$(date -u '+%Y%m%dT%H%M%SZ')-${GITHUB_RUN_ID}"

          # 每个仓库单独运行，便于设置超时和记录结果
          cat > "$work_root/sync-one-repo.sh" <<'WORKER'
          #!/usr/bin/env bash
          set -uo pipefail

          repo="$1"
          result_file="$2"
          run_stamp="$3"

          skip_repo() {
            local reason="$1"
            printf -- '- **跳过**：`%s` — %s\n' "$repo" "$reason" >> "$result_file"
            echo "跳过：$repo — $reason"
            exit 10
          }

          fail_repo() {
            local reason="$1"
            printf -- '- **失败**：`%s` — %s\n' "$repo" "$reason" >> "$result_file"
            echo "失败：$repo — $reason" >&2
            exit 1
          }

          ls_remote_with_retry() {
            local url="$1"
            local output_file="$2"
            local error_file="$3"
            local attempt

            for attempt in 1 2 3; do
              if git -c http.version=HTTP/1.1 ls-remote --heads "$url" \
                > "$output_file" 2> "$error_file"; then
                return 0
              fi

              echo "查询远程分支失败，第 $attempt/3 次：$url"
              if ((attempt < 3)); then
                sleep $((attempt * 2))
              fi
            done

            return 1
          }

          echo "正在处理：$repo"

          if ! repo_meta=$(gh api "repos/$repo" 2>&1); then
            skip_repo "仓库不存在或当前 Token 无权访问"
          fi

          upstream=$(jq -r '.parent.full_name // empty' <<< "$repo_meta")
          fork_default_branch=$(jq -r '.default_branch // empty' <<< "$repo_meta")

          if [[ -z "$upstream" ]]; then
            skip_repo "没有找到上游仓库"
          fi

          if ! upstream_meta=$(gh api "repos/$upstream" 2>&1); then
            skip_repo "上游仓库 \`$upstream\` 不存在或无法访问"
          fi

          default_branch=$(jq -r '.default_branch // empty' <<< "$upstream_meta")
          if [[ -z "$default_branch" ]]; then
            fail_repo "无法读取上游默认分支名称"
          fi

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          upstream_refs_file="$tmp_dir/upstream-refs"
          upstream_error_file="$tmp_dir/upstream-error"
          fork_refs_file="$tmp_dir/fork-refs"
          fork_error_file="$tmp_dir/fork-error"

          if ! ls_remote_with_retry \
            "https://github.com/$upstream.git" \
            "$upstream_refs_file" \
            "$upstream_error_file"; then
            error_text=$(tr '\n' ' ' < "$upstream_error_file")
            fail_repo "连续 3 次查询上游 \`$upstream\` 分支失败：$error_text"
          fi

          if ! ls_remote_with_retry \
            "https://github.com/$repo.git" \
            "$fork_refs_file" \
            "$fork_error_file"; then
            error_text=$(tr '\n' ' ' < "$fork_error_file")
            fail_repo "连续 3 次查询 Fork 分支失败：$error_text"
          fi

          declare -A upstream_sha_by_branch=()
          declare -A fork_sha_by_branch=()

          while read -r sha ref; do
            [[ -n "${sha:-}" && -n "${ref:-}" ]] || continue
            branch="${ref#refs/heads/}"
            upstream_sha_by_branch["$branch"]="$sha"
          done < "$upstream_refs_file"

          while read -r sha ref; do
            [[ -n "${sha:-}" && -n "${ref:-}" ]] || continue
            branch="${ref#refs/heads/}"
            fork_sha_by_branch["$branch"]="$sha"
          done < "$fork_refs_file"

          upstream_sha="${upstream_sha_by_branch[$default_branch]:-}"
          if [[ -z "$upstream_sha" ]]; then
            fail_repo "在上游分支列表中找不到默认分支 \`$default_branch\`"
          fi

          fork_sha="${fork_sha_by_branch[$default_branch]:-}"

          if [[ -z "$fork_sha" ]]; then
            echo "创建缺失的默认分支：$repo:$default_branch"
            if ! gh api --method POST "repos/$repo/git/refs" \
              -f "ref=refs/heads/$default_branch" \
              -f "sha=$upstream_sha" >/dev/null; then
              fail_repo "创建默认分支 \`$default_branch\` 失败"
            fi
            printf -- '- **已创建默认分支**：`%s` 的 `%s`，提交 `%s`\n' \
              "$repo" "$default_branch" "$upstream_sha" >> "$result_file"

          elif [[ "$fork_sha" == "$upstream_sha" ]]; then
            echo "默认分支已是最新：$repo:$default_branch"

          else
            # 先尝试普通快进更新；如果被拒绝，先备份旧提交，再强制更新。
            if gh api --method PATCH \
              "repos/$repo/git/refs/heads/$default_branch" \
              -f "sha=$upstream_sha" \
              -F force=false >/dev/null 2>&1; then
              echo "已快进更新：$repo:$default_branch"
              printf -- '- **已更新**：`%s` 分支 `%s`，`%s` → `%s`\n' \
                "$repo" "$default_branch" "$fork_sha" "$upstream_sha" >> "$result_file"
            else
              safe_branch="${default_branch//\//--}"
              backup_ref="refs/tags/fork-sync-backup/$run_stamp/$safe_branch"

              echo "普通更新被拒绝，先备份旧提交：$repo:$default_branch"
              if ! gh api --method POST "repos/$repo/git/refs" \
                -f "ref=$backup_ref" \
                -f "sha=$fork_sha" >/dev/null; then
                fail_repo "无法备份旧提交 \`$fork_sha\`，因此没有强制覆盖分支"
              fi

              if ! gh api --method PATCH \
                "repos/$repo/git/refs/heads/$default_branch" \
                -f "sha=$upstream_sha" \
                -F force=true >/dev/null; then
                fail_repo "强制更新失败；旧提交备份保存在 \`$backup_ref\`"
              fi

              printf -- '- **已强制覆盖**：`%s` 分支 `%s`，`%s` → `%s`；旧提交备份：`%s`\n' \
                "$repo" "$default_branch" "$fork_sha" "$upstream_sha" "$backup_ref" \
                >> "$result_file"
              echo "已强制覆盖：$repo:$default_branch；备份：$backup_ref"
            fi
          fi

          # 如果上游默认分支改名，先调整 Fork 的默认分支，再清理旧分支。
          if [[ "$fork_default_branch" != "$default_branch" ]]; then
            if ! gh api --method PATCH "repos/$repo" \
              -f "default_branch=$default_branch" >/dev/null; then
              fail_repo "分支已同步，但无法将 Fork 默认分支设为 \`$default_branch\`，因此跳过删除分支"
            fi
          fi

          # 删除上游已不存在的 Fork 分支。
          # 仍存在于上游的非默认分支不会被更新或删除。
          for branch in "${!fork_sha_by_branch[@]}"; do
            if [[ -n "${upstream_sha_by_branch[$branch]:-}" ]]; then
              continue
            fi

            if [[ "$branch" == "$default_branch" ]]; then
              continue
            fi

            echo "删除上游已不存在的分支：$repo:$branch"
            if ! gh api --method DELETE \
              "repos/$repo/git/refs/heads/$branch" >/dev/null; then
              fail_repo "删除上游已不存在的分支 \`$branch\` 失败"
            fi

            printf -- '- **已删除分支**：`%s` 的 `%s`（上游已删除）\n' \
              "$repo" "$branch" >> "$result_file"
          done

          printf -- '- **完成**：`%s` 默认分支 `%s` 已同步\n' \
            "$repo" "$default_branch" >> "$result_file"
          exit 0
          WORKER

          chmod +x "$work_root/sync-one-repo.sh"

          echo "正在获取 $OWNER 名下的 Fork 仓库列表……"
          if ! repo_json=$(gh repo list "$OWNER" --limit 1000 --fork --json nameWithOwner); then
            echo "::error::无法获取 Fork 仓库列表，请检查 SYNC_GITHUB_TOKEN 权限。"
            exit 1
          fi

          mapfile -t listed_repos < <(jq -r '.[].nameWithOwner' <<< "$repo_json")

          repos=()
          current_repo="${GITHUB_REPOSITORY,,}"

          for repo in "${listed_repos[@]}"; do
            if [[ "${repo,,}" == "$current_repo" ]]; then
              echo "排除当前工作流仓库：$repo"
              continue
            fi
            repos+=("$repo")
          done

          total_count=${#repos[@]}
          success_count=0
          skipped_count=0
          timeout_count=0
          failed_count=0

          {
            echo '# Fork 仓库同步报告'
            echo
            echo "运行时间（UTC）：$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo '单仓库超时限制：10 分钟'
            echo "已排除当前工作流仓库：$GITHUB_REPOSITORY"
            echo
            echo '## 仓库处理结果'
            echo
          } > "$report_file"

          index=0
          for repo in "${repos[@]}"; do
            index=$((index + 1))
            result_file="$work_root/result-$index.md"
            : > "$result_file"

            echo "[$index/$total_count] 开始处理 $repo（最多 10 分钟）"

            set +e
            timeout --signal=TERM --kill-after=5s 600s \
              bash "$work_root/sync-one-repo.sh" "$repo" "$result_file" "$run_stamp"
            exit_code=$?
            set -e

            case "$exit_code" in
              0)
                success_count=$((success_count + 1))
                ;;
              10)
                skipped_count=$((skipped_count + 1))
                ;;
              124|137)
                timeout_count=$((timeout_count + 1))
                printf -- '- **超时**：`%s` 处理超过 10 分钟，已停止本仓库并继续\n' \
                  "$repo" >> "$result_file"
                echo "::warning title=仓库同步超时::$repo 处理超过 10 分钟，已停止并继续处理其他仓库。"
                ;;
              *)
                failed_count=$((failed_count + 1))
                if [[ ! -s "$result_file" ]]; then
                  printf -- '- **失败**：`%s` 脚本退出码 `%s`，请检查运行日志\n' \
                    "$repo" "$exit_code" >> "$result_file"
                fi
                ;;
            esac

            cat "$result_file" >> "$report_file"
            rm -f "$result_file"
          done

          {
            echo
            echo '## 统计'
            echo
            echo "- Fork 列表中的仓库数：${#listed_repos[@]}"
            echo "- 实际处理数（已排除自身）：$total_count"
            echo "- 成功：$success_count"
            echo "- 跳过：$skipped_count"
            echo "- 超时：$timeout_count"
            echo "- 失败：$failed_count"
          } >> "$report_file"

          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

          echo "汇总：处理 $total_count 个；成功 $success_count；跳过 $skipped_count；超时 $timeout_count；失败 $failed_count"

          if ((timeout_count > 0 || failed_count > 0)); then
            exit 1
          fi
